    <rect width="512" height="512" fill="url(#bg)"/>
  </g>
  <g id="foreground">
    <polygon points="156,158 224,158 256,268 288,158 356,158 290,362 222,362" fill="#FFFFFF"/>
    <g fill="#FFC300"><rect x="316" y="132" width="30" height="92" rx="8"/><rect x="285" y="163" width="92" height="30" rx="8"/></g>
  </g>
</svg>
