name: Historical separate visual test pre-release

on:
  push:
    branches: [publish/visual-test-20261022]
    paths:
      - .github/workflows/visual-test-release.yml

permissions:
  contents: read

concurrency:
  group: visual-test-release-20261022
  cancel-in-progress: false

jobs:
  build:
    # This one-off release has been published with its own app ID and key.
    # Future pre-releases use DEV_KEYSTORE through c-cpp.yml. Do not rebuild
    # the published separate app with a different key.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VCPKG_MAX_CONCURRENCY: '4'
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
    steps:
      - name: Require the existing CI signing key
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          DEV_SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          DEV_SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          DEV_SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE DEV_SIGNING_STORE_PASSWORD DEV_SIGNING_KEY_ALIAS DEV_SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name. The separate visual test requires the existing CI signing key."
              exit 1
            fi
          done
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install pinned build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config autoconf automake libtool perl zip unzip
          python3 -m venv "$RUNNER_TEMP/vita-tools"
          "$RUNNER_TEMP/vita-tools/bin/pip" install cmake==3.31.10 ninja==1.13.0
          echo "$RUNNER_TEMP/vita-tools/bin" >> "$GITHUB_PATH"
          echo "VCPKG_ROOT=$RUNNER_TEMP/vita-vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vita-vcpkg-cache" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/vita-android-user" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vita-vcpkg-cache" "$RUNNER_TEMP/vita-android-user/cache"
          python3 - <<'PY'
          import subprocess
          subprocess.run(['sdkmanager', '--install', 'platforms;android-35', 'build-tools;36.0.0', 'ndk;29.0.14206865'], input='y\n' * 100, text=True, check=True)
          PY
          baseline=$(python3 -c 'import json; print(json.load(open("vcpkg.json"))["builtin-baseline"])')
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vita-vcpkg"
          git -C "$RUNNER_TEMP/vita-vcpkg" checkout "$baseline"
          "$RUNNER_TEMP/vita-vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      - name: Check application source and Python tools
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          python3 .ci/test_dev_apk.py
          bash tools/release/check-no-signing-keys.sh
          python3 tools/android/test_perf_summary.py
          python3 tools/android/test_perf_report.py
          python3 tools/android/test_fps_sample.py
      - name: Restore the existing CI signing key
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/vitadev.keystore"
      - name: Build the separate ARM64 visual test APK
        shell: bash
        env:
          DEV_SIGNING_STORE_PATH: ${{ runner.temp }}/vitadev.keystore
          DEV_SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          DEV_SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          DEV_SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import cmake, os, pathlib, shutil
          root = pathlib.Path.cwd()
          for source, destination in [('data', 'data'), ('vita3k/shaders-builtin', 'shaders-builtin'), ('vita3k/icons', 'icons')]:
              shutil.copytree(root / source, root / 'android/app/assets' / destination, dirs_exist_ok=True)
          cmake_root = pathlib.Path(cmake.CMAKE_BIN_DIR).parent
          (root / 'android/local.properties').write_text(f'sdk.dir={os.environ["ANDROID_HOME"]}\ncmake.dir={cmake_root}\n')
          PY
          cd android
          ./gradlew --stacktrace --build-cache --max-workers=4 \
            -PvitaIsolatedVisualTest=true \
            "-PvitaDevVersionSuffix=-visual-test.$GITHUB_RUN_NUMBER" \
            :app:assembleReldebug
      - name: Verify and package the APK and symbols
        run: |
          python3 .ci/package-pocket-s-dev.py --output build/visual-test-release \
            --isolated-test --name VITAdev-visual-test-20261022 \
            --application-source a59d2796db3860e21ed5b67ce00aa8fc0966035f \
            --testing .scratch/visual-followup-2026-10-22/isolated-testing.md \
            --notes .scratch/visual-followup-2026-10-22/isolated-release-notes.md
      - name: Delete the temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/vitadev.keystore"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-test-release-20261022
          path: build/visual-test-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: visual-test-release-20261022
          path: artifacts
      - name: Verify and publish the prepared pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: niilo/VITAplus
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum -c SHA256SUMS
          gh api repos/niilo/VITAplus/releases/421002798 > "$RUNNER_TEMP/visual-release.json"
          python3 - <<'PY'
          import json, os, pathlib
          release = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'visual-release.json').read_text())
          assert release['draft'] and release['prerelease']
          assert release['tag_name'] == 'dev-plus-visuals-20261022'
          assert not release['assets'], 'The prepared draft must have no assets'
          PY
          gh release upload dev-plus-visuals-20261022 \
            VITAdev-visual-test-20261022-arm64.apk VITAdev-visual-test-20261022-symbols.zip \
            VITAdev-visual-test-20261022-source.patch build-manifest.json TESTING.md SHA256SUMS
          gh release edit dev-plus-visuals-20261022 \
            --target "$GITHUB_SHA" --title 'VITAdev Visual Test: Plus fixes, October 22' \
            --notes-file RELEASE_NOTES.md --draft=false --prerelease --latest=false
