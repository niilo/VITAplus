name: Build tool checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false
          persist-credentials: false
      - run: bash .ci/check-tools.sh
      - name: Check out GoogleTest for the allocator regression
        run: git submodule update --init external/googletest
      - run: bash .ci/test-native-mempool.sh
