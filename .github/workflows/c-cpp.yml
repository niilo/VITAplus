name: Release build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  BUILD_CONFIG: Release
  QT_VERSION: '6.11.0'
  SCCACHE_GHA_ENABLED: 'true'

jobs:
  linux-build:
    name: Linux x86_64 (Steam Deck)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up build environment (Linux)
        run: bash ./.ci/setup-linux.sh x86_64 with-appimage

      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          disable_annotations: true

      - name: Install Qt 6.11.0
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtmultimedia
          cache: true
          install-deps: 'true'

      - name: Build desktop target
        env:
          VITA3K_LINUXDEPLOY_COMMAND: /usr/local/bin/linuxdeploy-x86_64.AppImage
        run: bash ./.ci/build-desktop.sh --preset ci-linux-clang-appimage --config ${{ env.BUILD_CONFIG }}

      - name: Compute artifact paths
        shell: bash
        run: |
          echo "GIT_SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=vita3k-$(git rev-parse --short HEAD)-linux-x64" >> "$GITHUB_ENV"
          echo "ARTIFACT_DIR=artifacts/vita3k-$(git rev-parse --short HEAD)-linux-x64" >> "$GITHUB_ENV"

      - name: Stage desktop artifact
        run: bash ./.ci/package-desktop.sh --platform linux-x64 --preset ci-linux-clang-appimage --config ${{ env.BUILD_CONFIG }} --output-dir "${{ env.ARTIFACT_DIR }}"

      - name: Print sccache statistics
        run: sccache --show-stats

      - name: Upload desktop artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_DIR }}

  android-release:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/android-apk.yml
    with:
      channel: release
    secrets: inherit

  android-dev:
    uses: ./.github/workflows/android-apk.yml
    with:
      channel: dev
    secrets: inherit

  create-release:
    name: GitHub release
    needs: [linux-build, android-release, android-dev]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.linux-build.result == 'success' && needs.android-dev.result == 'success' && (needs.android-release.result == 'success' || needs.android-release.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: downloaded-artifacts
      - name: Verify and collect the release assets
        env:
          TAG: ${{ github.ref_name }}
        run: python3 .ci/collect-release.py "$TAG" downloaded-artifacts release-assets
      - name: Publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: niilo/VITAplus
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -c SHA256SUMS.txt
          if gh release view "$TAG" --json isDraft,targetCommitish > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            python3 - <<'PYCODE'
          import json, os, pathlib
          release = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'existing-release.json').read_text())
          assert release['isDraft'], 'Published releases are immutable; use a new version'
          assert release['targetCommitish'] == os.environ['GITHUB_SHA'], 'Draft targets another commit'
          PYCODE
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --verify-tag --draft \
              --title "VITA+ $TAG" --notes-file RELEASE_NOTES.md --latest=false
          fi
          gh release upload "$TAG" ./* --clobber
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest=true
          fi
