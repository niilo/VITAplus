name: Release build

# Builds run only when a release tag is pushed, for example:
#   git tag v1.2.0 && git push origin v1.2.0
# A tag with a dash (v1.2.0-rc1) makes a pre-release.
# Targets: Android arm64 (Ayaneo Pocket S) and Linux x86_64 (Steam Deck).
# The code for Windows and macOS stays in the repository, but CI does not build it.
on:
  push:
    tags:
      - 'v*'

# The token can only read by default. Only the release job gets write access.
# Actions are pinned to an exact commit (the tag is in the comment), so a moved tag
# cannot change the code that sees the signing secrets.
permissions:
  contents: read

env:
  BUILD_CONFIG: Release
  QT_VERSION: '6.11.0'
  SCCACHE_GHA_ENABLED: "true"

jobs:
  linux-build:
    name: Linux x86_64 (Steam Deck)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up build environment (Linux)
        run: bash ./.ci/setup-linux.sh x86_64 with-appimage

      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          disable_annotations: true

      - name: Install Qt 6.11.0
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtmultimedia
          cache: true
          install-deps: 'true'

      - name: Build desktop target
        env:
          VITA3K_LINUXDEPLOY_COMMAND: /usr/local/bin/linuxdeploy-x86_64.AppImage
        run: bash ./.ci/build-desktop.sh --preset ci-linux-clang-appimage --config ${{ env.BUILD_CONFIG }}

      - name: Compute artifact paths
        shell: bash
        run: |
          echo "GIT_SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=vita3k-$(git rev-parse --short HEAD)-linux-x64" >> "$GITHUB_ENV"
          echo "ARTIFACT_DIR=artifacts/vita3k-$(git rev-parse --short HEAD)-linux-x64" >> "$GITHUB_ENV"

      - name: Stage desktop artifact
        run: bash ./.ci/package-desktop.sh --platform linux-x64 --preset ci-linux-clang-appimage --config ${{ env.BUILD_CONFIG }} --output-dir "${{ env.ARTIFACT_DIR }}"

      - name: Print sccache statistics
        run: sccache --show-stats

      - name: Upload desktop artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_DIR }}

  android-build:
    name: Android arm64 (Ayaneo Pocket S)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: recursive

      # A release APK must be signed with the same key every time. Android refuses to update an
      # app that was signed with another key. See docs/release.md for the key and the secrets.
      - name: Check the signing secrets
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them (see docs/release.md) and push the tag again."
            exit 1
          fi

      - name: Restore native dependency cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            /usr/local/share/vcpkg/installed
            /usr/local/share/vcpkg/packages
          key: cache-android-native-${{ hashFiles('CMakeLists.txt', 'cmake/**', '.ci/**', 'android/app/build.gradle', 'vcpkg.json') }}
          restore-keys: |
            cache-android-native-

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          add-job-summary: on-failure
          cache-provider: basic
          validate-wrappers: false

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Set up Android build environment
        env:
          VCPKG_ROOT: /usr/local/share/vcpkg
        run: bash ./.ci/setup-android.sh

      - uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23

      - name: Decode Android keystore
        env:
          KEYSTORE_ENCODED: ${{ secrets.KEYSTORE }}
        run: |
          umask 077
          echo "$KEYSTORE_ENCODED" | base64 --decode > /home/runner/keystore.jks

      - name: Compute artifact paths
        shell: bash
        run: |
          echo "GIT_SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=vita3k-$(git rev-parse --short HEAD)-android" >> "$GITHUB_ENV"
          echo "ARTIFACT_DIR=artifacts/vita3k-$(git rev-parse --short HEAD)-android" >> "$GITHUB_ENV"

      - name: Build Android target
        env:
          SIGNING_STORE_PATH: /home/runner/keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VCPKG_ROOT: /usr/local/share/vcpkg
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: bash ./.ci/build-android.sh "${{ env.ARTIFACT_DIR }}"

      - name: Delete the keystore
        if: always()
        run: rm -f /home/runner/keystore.jks

      - name: Print Android ccache statistics
        run: ccache -s

      - name: Upload Android artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_DIR }}

  create-release:
    name: GitHub release
    needs: [linux-build, android-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: create-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8

      - name: Prepare release assets
        run: bash ./.ci/release-collect.sh "${{ github.ref_name }}"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The updater compares this number against the version of the running
          # build, so it has to be in the release body.
          version_info="$(bash tools/release/version-info.sh)"
          build_number="$(sed -n 's/^version_code=//p' <<< "$version_info")"
          build_version="$(sed -n 's/^version=//p' <<< "$version_info")"

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            notes_file="$(mktemp)"
            {
              echo "Vita3K Build: $build_number"
              echo
              echo "Version: $build_version"
              echo
              gh release view "$TAG" --json body --jq .body
            } > "$notes_file"
            gh release edit "$TAG" --notes-file "$notes_file"
          else
            flags=""
            if [[ "$TAG" == *-* ]]; then flags="--prerelease"; fi
            notes_file="$(mktemp)"
            {
              echo "Vita3K Build: $build_number"
              echo
              echo "Version: $build_version"
            } > "$notes_file"
            gh release create "$TAG" release-assets/* --title "VITA+ $TAG" \
              --notes-file "$notes_file" --verify-tag $flags
          fi
