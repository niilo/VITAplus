plugins {
	id 'com.android.application'
	id 'org.jetbrains.kotlin.plugin.compose'
}

def signingStorePath = System.getenv("SIGNING_STORE_PATH")
def signingStorePassword = System.getenv("SIGNING_STORE_PASSWORD")
def signingKeyAlias = System.getenv("SIGNING_KEY_ALIAS")
def signingKeyPassword = System.getenv("SIGNING_KEY_PASSWORD")
def hasCiSigning = signingStorePath && signingStorePassword && signingKeyAlias && signingKeyPassword

// versionName and versionCode come from tools/release/version-info.sh, the one
// place that decides what this build is called. CMake runs the same script for
// the native library, so the package version and the version inside the app
// always agree. docs/release.md explains the numbers.
//
// The script is run while the project is configured, because versionName and
// versionCode are needed there. providers.exec is used because a plain Process
// call at configuration time breaks the configuration cache. rootDir is the
// android/ folder, and the script is one level above it.
def versionInfo = [:]
def versionScript = new File(rootDir, "../tools/release/version-info.sh")
providers.exec {
	commandLine "bash", versionScript.absolutePath
	workingDir rootDir
	ignoreExitValue = true
}.standardOutput.asText.get().eachLine { line ->
	def index = line.indexOf('=')
	if (index > 0) {
		versionInfo[line.substring(0, index)] = line.substring(index + 1)
	}
}
if (!versionInfo['version']) {
	throw new GradleException(
		"${versionScript} produced no version, so the build cannot name itself.")
}
logger.info("Vita3K version ${versionInfo['version']} (versionCode ${versionInfo['version_code']})")

android {
	namespace = "org.vita3k.emulator"
	compileSdk = 35
	ndkVersion = "29.0.14206865"
	buildFeatures {
		buildConfig = true
		compose = true
	}

	defaultConfig {
		// namespace stays org.vita3k.emulator: it is the Java package the JNI symbols are bound to
		// The application ID of a release build. A development build adds the .debug
		// suffix below, so the two are separate apps and both can be installed. Each
		// app replaces the build before it, because Android matches an install on the
		// application ID and updates in place.
		//
		// Only an app signed with the release key can replace the release app. A build
		// signed with another key cannot be installed over it at all.
		applicationId = "org.vita3k.emulator"
		minSdk = 28
		targetSdk = 35
		versionCode = (versionInfo['version_code'] ?: '1') as Integer
		versionName = versionInfo['version'] ?: 'v0.0-dev.0'

		ndk {
			// x86_64 is emulator-only and broken here: vcpkg OpenSSL cannot assemble its x86 SM3/SM4 code with the NDK.
			abiFilters "arm64-v8a"
		}
	}

	signingConfigs {
		ci {
			if (hasCiSigning) {
				storeFile = file(signingStorePath)
				storePassword = signingStorePassword
				keyAlias = signingKeyAlias
				keyPassword = signingKeyPassword
			}
		}
	}

	// A release APK has to carry the release key, or Android refuses to install
	// it over the release app that is already on the device. Falling back to the
	// debug key used to produce an APK that installed as a separate app and
	// could never replace the release one, with no warning.
	//
	// The check goes in a task rather than in the release build type, because
	// build.gradle is evaluated once for every build type. A check in the
	// release block made a reldebug build fail, because the release block is
	// read even when it is not built. This task only runs when a release APK is
	// packaged.
	gradle.taskGraph.whenReady { graph ->
		def buildsRelease = graph.allTasks.any { it.name ==~ /package.*Release/ }
		if (buildsRelease && !hasCiSigning) {
			throw new GradleException(
				"A release build needs the release signing key, and none was passed in. " +
				"Set SIGNING_STORE_PATH, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS and " +
				"SIGNING_KEY_PASSWORD, which the container scripts do when the key is in " +
				".signing/release/ (see docs/release.md). Without the key the APK " +
				"cannot be installed over the release app already on a device, so it " +
				"would show up as a second app instead of replacing it. " +
				"To build a development build instead, use `android reldebug`.")
		}
	}

	buildTypes {
		debug {
			debuggable = true
			jniDebuggable = true
			applicationIdSuffix = '.debug'
		}

		reldebug {
			debuggable = true
			jniDebuggable = true
			externalNativeBuild {
				cmake {
					arguments "-DCMAKE_BUILD_TYPE=RelWithDebInfo"
				}
			}
			minifyEnabled = false
			shrinkResources = false
			// The development app ID, so a development build installs next to the release
			// app instead of over it. Development builds share this one ID and replace
			// each other, which is what makes a tester able to update one in place.
			applicationIdSuffix = '.debug'
			// The launcher name is VITAdev, from src/reldebug/res/values/strings.xml.
			signingConfig = signingConfigs.debug
		}

		release {
			debuggable = false
			jniDebuggable = false
			externalNativeBuild {
				cmake {
					arguments "-DCMAKE_BUILD_TYPE=Release"
				}
			}
			minifyEnabled = true
			shrinkResources = true
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
			// A release APK has to carry the release key. The build fails without
			// it, in the taskGraph check above. An earlier version fell back to the
			// debug key, which produced an APK that installed as a separate app
			// and could never replace the release one, with no warning.
			signingConfig = signingConfigs.ci
		}
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}

	sourceSets {
		main {
			jniLibs.srcDirs = ['../prebuilt']
			assets {
				srcDirs 'assets'
			}
			java {
				srcDirs += ['../../external/sdl/android-project/app/src/main/java']
			}
		}
	}

	externalNativeBuild {
		cmake {
			path = '../../CMakeLists.txt'
			version = '3.22.1+'
		}
	}

	lint {
		abortOnError = false
		checkReleaseBuilds = false
	}
	packaging {
		jniLibs {
			useLegacyPackaging = true
		}
	}
}

dependencies {
	implementation 'androidx.appcompat:appcompat:1.6.1'
	implementation "androidx.core:core:1.12.0"
	implementation 'androidx.core:core-google-shortcuts:1.1.0'
	implementation 'com.google.android.material:material:1.11.0'
	implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
	implementation 'com.getkeepsafe.relinker:relinker:1.4.5'

	implementation platform('androidx.compose:compose-bom:2025.04.00')
	implementation 'androidx.compose.ui:ui'
	implementation 'androidx.compose.material3:material3'
	implementation 'androidx.compose.material:material-icons-extended'
	implementation 'androidx.compose.ui:ui-tooling-preview'
	implementation 'androidx.activity:activity-compose:1.9.3'
	implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
	implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
	implementation 'androidx.navigation:navigation-compose:2.8.5'
	implementation 'io.coil-kt:coil-compose:2.7.0'
	debugImplementation 'androidx.compose.ui:ui-tooling'
}
